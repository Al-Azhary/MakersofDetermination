<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" href="assets/شعار.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو أسرة ضيافة العزم</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark: #2d2d2d;
            --gold: #fdb833;
            --white: #ffffff;
            --light-bg: #f4f4f4;
            --whatsapp: #25D366;
            --danger: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Almarai', sans-serif; background-color: var(--light-bg); color: var(--dark); overflow-x: hidden; }

        /* حاوية التنبيهات داخل الصفحة */
        #notification-container {
            position: fixed; top: 100px; left: 20px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px;
        }
        .notif {
            background: var(--dark); color: var(--gold);
            padding: 15px 25px; border-radius: 8px; border-right: 5px solid var(--gold);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: slideIn 0.4s forwards;
            font-size: 0.9rem; min-width: 200px;
        }
        @keyframes slideIn { from { transform: translateX(-120%); } to { transform: translateX(0); } }

        /* شريط التنقل */
        nav {
            background-color: var(--dark); padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 2000; border-bottom: 3px solid var(--gold);
        }
        .nav-title { color: var(--gold); font-size: 1.5rem; font-weight: 800; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a {
            color: var(--gold); text-decoration: none; font-weight: 700;
            padding: 8px 15px; border-radius: 5px; border: 1px solid var(--gold);
            transition: 0.3s; font-size: 0.9rem;
        }
        .nav-links a:hover { background: var(--gold); color: var(--dark); }

        /* البانر المقسم (1/4 شعار - 3/4 صور) */
        .slider-section {
            width: 100%; height: clamp(200px, 40vh, 450px);
            background-color: #000; overflow: hidden; position: relative;
        }
        .slides-wrapper { display: flex; width: 300%; height: 100%; transition: transform 0.8s ease-in-out; }
        .slide-unit { width: 33.333%; height: 100%; display: flex; }
        .logo-box {
            width: 25%; height: 100%; background-color: var(--dark);
            display: flex; align-items: center; justify-content: center; border-left: 2px solid var(--gold);
        }
        .logo-box img { max-width: 80%; max-height: 80%; object-fit: contain; }
        .image-box { width: 75%; height: 100%; background-size: cover; background-position: center; }

        /* المحتوى الرئيسي */
        .main-layout { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .cat-card { background: var(--white); border-radius: 20px; padding: 25px; margin-bottom: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .cat-title { border-right: 6px solid var(--gold); padding-right: 15px; margin-bottom: 25px; font-size: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .item-box { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 15px; text-align: center; transition: 0.3s; }
        .item-box:hover { border-color: var(--gold); transform: translateY(-5px); }
        .btn-add { background: var(--gold); border: none; padding: 10px; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; font-family: inherit; }

        /* القائمة في الأسفل */
        .bottom-cart {
            background: var(--white); border-radius: 20px; padding: 30px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.1); margin-top: 50px; border-top: 5px solid var(--gold);
        }
        .bottom-cart h2 { text-align: center; margin-bottom: 20px; }
        .cart-list { list-style: none; max-width: 800px; margin: 0 auto 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .item-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-weight: bold; font-size: 1.2rem; }
        .qty-val { font-weight: 800; min-width: 25px; text-align: center; }
        .btn-del { color: var(--danger); background: none; border: none; cursor: pointer; font-weight: bold; margin-right: 10px; }

        .input-group { max-width: 500px; margin: 0 auto; }
        .input-user { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #eee; margin-bottom: 15px; font-family: inherit; font-size: 1rem; }
        .btn-send { width: 100%; padding: 16px; background: var(--whatsapp); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }

        footer { background: var(--dark); color: white; padding: 40px 20px; text-align: center; margin-top: 50px; }
        .copy-pill { background: #444; border: 1px solid var(--gold); padding: 8px 15px; border-radius: 8px; cursor: pointer; color: var(--gold); font-size: 0.8rem; margin: 5px; display: inline-block; }

        #btn-up { position: fixed; bottom: 20px; right: 20px; width: 45px; height: 45px; background: var(--dark); color: var(--gold); border: 2px solid var(--gold); border-radius: 50%; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 1000; }

        @media (max-width: 768px) {
            .slide-unit { flex-direction: column; }
            .logo-box { width: 100%; height: 30%; border-left: none; border-bottom: 2px solid var(--gold); }
            .image-box { width: 100%; height: 70%; }
        }
    </style>
</head>
<body>

    <div id="notification-container"></div>
    <button id="btn-up" onclick="window.scrollTo(0,0)">↑</button>

    <nav>
        <div class="nav-title">أسرة ضيافة العزم</div>
        <div class="nav-links">
            <a href="#salty-sec">المالحة</a>
            <a href="#sweet-sec">الحلوة</a>
            <a href="#drink-sec">المشروبات</a>
        </div>
    </nav>

    <section class="slider-section">
        <div class="slides-wrapper" id="main-slider">
            <div class="slide-unit">
                <div class="logo-box"><img src="assets/شعار.png" alt="logo"></div>
                <div class="image-box" style="background-image: url('assets/1.png');"></div>
            </div>
            <div class="slide-unit">
                <div class="logo-box"><img src="assets/شعار 1.png" alt="logo"></div>
                <div class="image-box" style="background-image: url('assets/2.png');"></div>
            </div>
            <div class="slide-unit">
                <div class="logo-box"><img src="assets/شعار.png" alt="logo"></div>
                <div class="image-box" style="background-image: url('assets/3.png');"></div>
            </div>
        </div>
    </section>

    <div class="main-layout">
        <div id="salty-sec" class="cat-card">
            <h2 class="cat-title">الأطباق المالحة</h2>
            <div class="grid" id="salty-grid"></div>
        </div>

        <div id="sweet-sec" class="cat-card">
            <h2 class="cat-title">الأطباق الحلوة</h2>
            <div class="grid" id="sweet-grid"></div>
        </div>

        <div id="drink-sec" class="cat-card">
            <h2 class="cat-title">المشروبات</h2>
            <div class="grid" id="drink-grid"></div>
        </div>

        <div class="bottom-cart">
            <h2>قائمة طلباتك المختارة</h2>
            <ul id="cart-list" class="cart-list">
                <li style="border:none; color:#aaa; text-align:center; padding:20px;">القائمة فارغة</li>
            </ul>
            <div class="input-group">
                <input type="text" id="user-name" class="input-user" placeholder="ادخل اسمك هنا">
                <button class="btn-send" onclick="sendOrder()">تأكيد وإرسال عبر واتساب</button>
            </div>
        </div>
    </div>

    <footer>
        <div>
            <div class="copy-pill" onclick="copy('0502069445')">جوال: 0502069445 (نسخ)</div>
            <div class="copy-pill" onclick="copy('abdelwhabhany62@gmail.com')">البريد الإلكتروني (نسخ)</div>
        </div>
        <p style="margin-top: 15px;">جميع الحقوق محفوظة لأسرة ضيافة العزم &copy; 2026</p>
    </footer>

    <script>
        const categories = {
            salty: ["فطائر لبنة", "سمبوسة جبن", "سمبوسة لحم", "ميني بيتزا", "ورق عنب", "كبة برغل", "أصابع موزاريلا", "مناقيش زعتر", "سبرنغ رولز", "فطائر عكاوي"],
            sweet: ["بسبوسة قشطة", "لقيمات عسل", "تمر سكري", "كيكة زعفران", "حلا لندن", "سينامون رولز", "بان كيك", "كوكيز", "قطايف", "رز بلبن"],
            drinks: ["قهوة عربية", "شاي أحمر", "عصير برتقال", "ليمون بالنعناع", "ماء بارد"]
        };

        let cart = {};

        function showNotify(msg) {
            const container = document.getElementById('notification-container');
            const notify = document.createElement('div');
            notify.className = 'notif';
            notify.innerText = msg;
            container.appendChild(notify);
            setTimeout(() => { notify.remove(); }, 3000);
        }

        function render(items, id) {
            const el = document.getElementById(id);
            items.forEach(name => {
                const div = document.createElement('div');
                div.className = 'item-box';
                div.innerHTML = `<strong>${name}</strong><button class="btn-add" onclick="add('${name}')">إضافة</button>`;
                el.appendChild(div);
            });
        }
        render(categories.salty, 'salty-grid');
        render(categories.sweet, 'sweet-grid');
        render(categories.drinks, 'drink-grid');

        function add(n) { 
            cart[n] = (cart[n] || 0) + 1; 
            updateUI(); 
            showNotify(`تمت إضافة ${n} للقائمة`);
        }
        function changeQty(n, a) { if(cart[n]){ cart[n]+=a; if(cart[n]<=0) delete cart[n]; updateUI(); } }
        function del(n) { delete cart[n]; updateUI(); showNotify(`تم حذف ${n}`); }

        function updateUI() {
            const list = document.getElementById('cart-list');
            const keys = Object.keys(cart);
            list.innerHTML = keys.length ? '' : '<li style="border:none; color:#aaa; text-align:center; padding:20px;">القائمة فارغة</li>';
            keys.forEach(k => {
                const li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `
                    <strong style="flex:1">${k}</strong>
                    <div class="item-controls">
                        <button class="qty-btn" onclick="changeQty('${k}', 1)">+</button>
                        <span class="qty-val">${cart[k]}</span>
                        <button class="qty-btn" onclick="changeQty('${k}', -1)">-</button>
                        <button class="btn-del" onclick="del('${k}')">حذف</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function copy(v) { navigator.clipboard.writeText(v).then(() => showNotify("تم النسخ بنجاح")); }

function sendOrder() {
    const keys = Object.keys(cart);
    if (!keys.length) return showNotify("القائمة فارغة.. اختر ما يسر خاطرك أولاً");
    const uName = document.getElementById('user-name').value;
    if (!uName) return showNotify("يرجى إدخال اسمك الكريم");

    // السطر المطلوب: ترحيب ودعاء بالعافية
    let msg = "يا هلا بك يا " + uName + "، استلمنا طلبك بكل حب، وبالهناء والشفاء والعافية على قلبك.\n";
    msg += "تفاصيل طلبك هي:\n";

    const saltyOrder = keys.filter(k => categories.salty.includes(k));
    const sweetOrder = keys.filter(k => categories.sweet.includes(k));
    const drinkOrder = keys.filter(k => categories.drinks.includes(k));

    // الأطباق المالحة
    if (saltyOrder.length) {
        msg += "\n* الأطباق المالحة:\n";
        saltyOrder.forEach((k, i) => {
            msg += "  " + (i + 1) + ". " + k + " [العدد: " + cart[k] + "]\n";
        });
    }

    // الأطباق الحلوة
    if (sweetOrder.length) {
        msg += "\n* الأطباق الحلوة:\n";
        sweetOrder.forEach((k, i) => {
            msg += "  " + (i + 1) + ". " + k + " [العدد: " + cart[k] + "]\n";
        });
    }

    // المشروبات
    if (drinkOrder.length) {
        msg += "\n* المشروبات:\n";
        drinkOrder.forEach((k, i) => {
            msg += "  " + (i + 1) + ". " + k + " [العدد: " + cart[k] + "]\n";
        });
    }

    // فتح الرابط بشكل سليم
    const whatsappURL = "https://wa.me/966502069445?text=" + encodeURIComponent(msg);
    window.open(whatsappURL, '_blank');
}

        let idx = 0;
        setInterval(() => {
            idx = (idx + 1) % 3;
            document.getElementById('main-slider').style.transform = `translateX(${idx * 33.333}%)`;
        }, 5000);

        window.onscroll = () => { document.getElementById("btn-up").style.display = (window.scrollY > 400) ? "flex" : "none"; };
    </script>
</body>
</html>
